<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Le carnet de recettes de Fanie et Michael">
<meta name="theme-color" content="#D5EAC3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#22301B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes F&amp;M">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Les recettes de Fanie & Michael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block">
<style>
/* Layout : appli mobile de cuisine — barre d'appli en haut, une vue à la fois, barre d'onglets fixe en bas sur téléphone */
:root{
  --bg:#F3F8EE; --head:#D5EAC3; --surface:#FFFFFF; --sunk:#E9F2E1; --line:#D9E6CE; --ink:#2C3826; --muted:#62705A;
  --accent:#B4496A; --on-accent:#FFFFFF; --green:#5C8C39; --on-green:#FFFFFF; --green-soft:#D5EAC3; --on-green-soft:#2F4A1C;
  --hl:#F8D3DD; --on-hl:#6A2238; --danger:#B3261E;
  --f-display:"Fredoka",ui-rounded,system-ui,-apple-system,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A12; --head:#22301B; --surface:#1C2419; --sunk:#252F20; --line:#33422B; --ink:#E7EFE0; --muted:#A3B198;
  --accent:#EC9BB5; --on-accent:#3A0F1F; --green:#A5D27F; --on-green:#15220B; --green-soft:#2C3F22; --on-green-soft:#CFE8B8;
  --hl:#5A2638; --on-hl:#FBD9E3; --danger:#F2867E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141A12; --head:#22301B; --surface:#1C2419; --sunk:#252F20; --line:#33422B; --ink:#E7EFE0; --muted:#A3B198;
  --accent:#EC9BB5; --on-accent:#3A0F1F; --green:#A5D27F; --on-green:#15220B; --green-soft:#2C3F22; --on-green-soft:#CFE8B8;
  --hl:#5A2638; --on-hl:#FBD9E3; --danger:#F2867E; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";vertical-align:-4px;overflow:hidden;width:1em}

/* Barre d'appli */
header.top{background:var(--head);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
header.top .wrap{padding-block:12px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:26px;flex:none}
.brand small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-green-soft);font-weight:800}
.brand h1{font-size:clamp(19px,5vw,28px);color:var(--ink)}
.brand h1 em{font-style:normal;color:var(--accent)}
.top-actions{display:flex;gap:8px}
@media (max-width:720px){.top-actions{display:none}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status{font-size:13px;color:var(--muted);padding-block:10px 0;margin:0}
main{padding-block:12px 90px}
@media (max-width:720px){main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}}
.input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px}
.input:focus{border-color:var(--green);outline:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Barre d'onglets (téléphone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
@media (min-width:721px){.tabbar{display:none}}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0;border-radius:12px}
.tabbar button .ms{font-size:24px;vertical-align:0}
.tabbar button[aria-current="page"]{color:var(--green)}
.tabbar button.add .ms{background:var(--accent);color:var(--on-accent);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;margin-top:-18px;border:4px solid var(--surface);box-sizing:content-box}
.tabbar button.add{color:var(--accent)}

/* Chips : rose = ingrédient, vert = type ou style */
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .ms{font-size:18px;vertical-align:0}
.chip:hover{border-color:var(--green)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip.on-ingr,.chip[aria-pressed="true"].ingr{background:var(--hl);border-color:var(--hl);color:var(--on-hl)}
.chip.on-style,.chip[aria-pressed="true"]:not(.ingr){background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip.ingr:not([aria-pressed="true"]){background:var(--surface)}
.chip .x-in{margin-left:2px;font-weight:800}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

/* Recherche */
.hero-search{position:relative}
.hero-search .input{font-size:17px;padding:15px 16px 15px 48px;border-radius:999px;border-width:2px}
.hero-search .ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--green);font-size:22px;pointer-events:none}
.sug{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;margin-top:8px;padding:12px;display:grid;gap:12px}
.sug .grp{display:grid;gap:6px}
.sug .grp > span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sug .rec{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:var(--sunk);border-radius:12px;padding:9px 12px;font-weight:800}
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.block{margin-top:22px}
.block h2{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.block h2 .ms{color:var(--green);font-size:24px;vertical-align:0}
details.more{margin-top:16px}
details.more summary{cursor:pointer;font-weight:800;color:var(--green)}
.more-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.switch{display:flex;gap:10px;align-items:center;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--green)}

/* Résultats */
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.results-head h2{font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--green)}
.card > *:not(.thumb){margin-inline:6px}
.card h3{font-size:19px}
.thumb{position:relative;height:96px;border-radius:14px;display:grid;place-items:center}
.thumb .ms{font-size:44px;width:auto;vertical-align:0}
.thumb.t-rose{background:var(--hl);color:var(--on-hl)}
.thumb.t-green{background:var(--green-soft);color:var(--on-green-soft)}
.thumb .badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--ink)}
.thumb .badge.ex{right:8px;left:auto;color:var(--muted)}
.thumb.big{height:150px}
.thumb.photo{background-size:cover;background-position:center;background-color:var(--sunk)}
.thumb.big.photo{height:min(56vw,320px)}
.photobox{display:grid;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:12px}
.photobox.over{border-color:var(--green);background:var(--green-soft)}
@media (hover:hover) and (pointer:fine){.photobox .cam{display:none}}
@media (pointer:coarse){.photobox .drop-hint{display:none}}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:12px;background-size:cover;background-position:center;flex:none;box-sizing:border-box}
.av.f{background-color:var(--hl);color:var(--on-hl)}
.av.m{background-color:var(--green-soft);color:var(--on-green-soft)}
.av.sm{width:32px;height:32px;font-size:14px}
.av.md{width:56px;height:56px;font-size:22px}
.av.lg{width:110px;height:110px;font-size:44px}
.avs{display:inline-flex;align-items:center}
.avs .av+.av{margin-left:-8px;border:2px solid var(--surface)}
.avbtn{background:none;border:0;padding:4px;border-radius:999px;margin-left:auto}
.by{display:inline-flex;align-items:center;gap:6px}
.whos{display:flex;flex-wrap:wrap;gap:10px}
.who{display:grid;justify-items:center;gap:6px;min-width:96px;border:2px solid var(--line);border-radius:18px;padding:12px 10px;background:var(--surface);font-weight:800}
.who[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--on-green-soft)}
.profils{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.profil{display:grid;justify-items:center;gap:10px;text-align:center}
.profil .photobox{width:100%;box-sizing:border-box;justify-items:center}
.people{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.pp{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800;white-space:nowrap}
.pp .n{font-size:12px;color:var(--muted);font-weight:500}
.pp[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--on-green-soft)}
.pp[aria-pressed="true"] .n{color:var(--on-green-soft)}
.av.all{width:32px;height:32px;background:var(--sunk);color:var(--green)}
.av.all .ms{font-size:18px;vertical-align:0}
.av.g{background-color:var(--sunk);color:var(--ink)}
.tabbar{grid-template-columns:repeat(5,1fr)}
.tabbar button{position:relative}
.badge-n{position:absolute;top:0;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:18px}
.prop{display:grid;gap:10px}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.pill.s-en_attente{background:var(--hl);color:var(--on-hl)}
.pill.s-validee{background:var(--green-soft);color:var(--on-green-soft)}
.pill.s-refusee{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.sublbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 6px}
.thumb.big .ms{font-size:64px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);align-items:center}
.meta .ms{font-size:17px;vertical-align:-3px;color:var(--green)}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--on-green-soft)}
.tag.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.ingr-preview{font-size:14px;color:var(--muted);margin:0}
.ingr-preview mark{background:var(--hl);color:var(--on-hl);border-radius:4px;padding:0 3px}
.match{font-size:13px;font-weight:800;color:var(--green)}
.match .miss{color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* Fiche */
.fiche{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;margin-top:14px}
@media (max-width:720px){.fiche{grid-template-columns:1fr}.fiche > aside{order:2}}
.fiche h2{font-size:clamp(28px,6vw,40px)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ilist li:last-child{border-bottom:0}
.ilist li.hit span:first-child{font-weight:800}
.ilist li.hit span:first-child::before{content:"● ";color:var(--accent)}
.qty{font-family:var(--f-mono);white-space:nowrap;color:var(--muted)}
.steps{margin:0;padding-left:26px;display:grid;gap:12px}
.steps li::marker{font-family:var(--f-display);color:var(--accent);font-weight:600}
.stepper-n{display:inline-flex;align-items:center;gap:10px}
.round{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;line-height:1;color:var(--green)}
.src{word-break:break-all}
.src a{color:var(--accent)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:1.5px solid var(--danger);border-radius:14px;margin-top:12px}

/* Assistant d'ajout */
.steps-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 18px;scrollbar-width:none}
.steps-nav button{border:0;background:none;display:flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);padding:6px 10px 6px 6px;border-radius:999px;white-space:nowrap}
.steps-nav button b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font-family:var(--f-display);font-size:13px;color:var(--ink)}
.steps-nav button[aria-current="step"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.steps-nav button[aria-current="step"] b,.steps-nav button.done b{background:var(--green);color:var(--on-green)}
.wz{display:grid;gap:20px}
.wz h2{font-size:26px}
.q{display:grid;gap:8px}
.q > label,.q > .lbl{font-size:16px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink);margin:0}
.big{font-size:20px;padding:14px 16px;font-family:var(--f-display);font-weight:500}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.choice{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px}
.choice:hover{border-color:var(--green)}
.choice .ms{font-size:32px;width:auto;color:var(--accent)}
.choice strong{font-family:var(--f-display);font-weight:600;font-size:20px}
.choice span:not(.ms){color:var(--muted)}
.resume{border:1.5px dashed var(--green);background:var(--green-soft);color:var(--on-green-soft);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.addbox .input{font-size:16px;padding:14px 16px}
.ilines{display:grid;gap:8px}
.iline{display:grid;grid-template-columns:minmax(0,1fr) 78px 124px 36px;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
@media (max-width:480px){.iline{grid-template-columns:minmax(0,1fr) 62px 98px 34px}}
.iline .name{font-weight:800;overflow-wrap:anywhere}
.iline .input{padding:8px 9px;background:var(--bg);border-radius:10px}
.x{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;color:var(--muted)}
details.cat{border-top:1px solid var(--line);padding-block:8px}
details.cat summary{cursor:pointer;font-weight:800;padding:4px 0}
details.cat .row{padding:8px 0 4px}
.sline{display:grid;grid-template-columns:30px minmax(0,1fr) 36px;gap:8px;align-items:start}
.sline .n{font-family:var(--f-display);color:var(--accent);font-weight:600;padding-top:10px;text-align:right;font-size:17px}
.sline textarea{min-height:46px;resize:vertical}
textarea.input{min-height:110px;resize:vertical}
.wzbar{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);margin-top:24px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.wzbar .msg{flex:1;min-width:0;font-size:14px}
.err{color:var(--danger)}
.ok{color:var(--green);font-weight:800}
.review{display:grid;gap:12px}
.review .panel{display:grid;gap:8px}
.review .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:800;padding:4px}
@media (prefers-reduced-motion:no-preference){.card,.btn,.chip,.choice{transition:border-color .15s,background .15s}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="home" type="button" aria-label="Accueil">
      <span class="logo ms" aria-hidden="true">skillet</span>
      <span><small>Nos recettes</small><h1>Les recettes de <em>Fanie</em> &amp; <em>Michael</em></h1></span>
    </button>
    <button class="avbtn" id="nav-profils" type="button" aria-label="Profils de Fanie et Michael"><span id="hdr-avs" class="avs"></span></button>
    <div class="top-actions">
      <button class="btn" id="nav-hasard" type="button"><span class="ms" aria-hidden="true">casino</span>Au hasard</button>
      <button class="btn" id="nav-extra" type="button"><span class="ms" aria-hidden="true">fact_check</span><span id="nav-extra-l">À valider</span></button>
      <button class="btn primary" id="nav-ajout" type="button"><span class="ms" aria-hidden="true">add</span>Ajouter</button>
    </div>
  </div>
</header>
<div class="wrap"><p class="status" id="status">Chargement du carnet…</p></div>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="tabbar" aria-label="Navigation">

function uniteParDefaut(nom){
  const n=norm(nom);
  if(["sel","poivre","muscade","piment","herbes de provence"].includes(n)) return "au goût";
  if(n==="ail") return "gousse";
  if(["oeufs","oignon","echalote","citron","citron vert","pomme","poire","banane","orange","avocat","courgette","aubergine","poivron","carotte","tomate","concombre","pate feuilletee","pate brisee","pate a pizza","bouillon cube","laurier"].includes(n)) return "pièce";
  if(["lait","creme liquide","huile d'olive","huile de tournesol","vin blanc","vin rouge","lait de coco","sauce soja","vinaigre","vinaigre balsamique"].includes(n)) return "ml";
  return "g";
}

/* « 200 g de farine », « 3 oeufs », « 2 cs huile d'olive » → {qte, unite, nom} */
const ALIAS_UNITES = [
  [/^(kg|kilos?|kilogrammes?)$/,"kg"],[/^(g|gr|grs|grammes?)$/,"g"],[/^(ml|millilitres?)$/,"ml"],[/^(cl|centilitres?)$/,"cl"],[/^(l|litres?)$/,"L"],
  [/^(cs|c\.?s\.?|cas|c\.? ?a\.? ?s\.?|cuil+eres? a soupe|cuil+ere a soupe|c\. a soupe|c a soupe|tbsp)$/,"c. à soupe"],
  [/^(cc|c\.?c\.?|cac|c\.? ?a\.? ?c\.?|cuil+eres? a cafe|c\. a cafe|c a cafe|tsp)$/,"c. à café"],
  [/^(pincees?)$/,"pincée"],[/^(sachets?)$/,"sachet"],[/^(gousses?)$/,"gousse"],[/^(tranches?)$/,"tranche"],[/^(boites?|conserves?)$/,"boîte"],[/^(pieces?|pcs?)$/,"pièce"]
];
function trouverUnite(t){ for(const [re,u] of ALIAS_UNITES) if(re.test(t)) return u; return null; }
function nomConnu(nom){
  const s=sing(nom);
  return tousIngredientsConnus().find(n=>sing(n)===s) || null;
}
function analyserLigne(txt){
  let s=String(txt).trim().replace(/\s+/g," ");
  if(!s) return null;
  const m=s.match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|½|¼|¾)\s*(.*)$/);
  let qte="", unite=null, reste=s;
  if(m){
    qte=m[1].replace("½","0,5").replace("¼","0,25").replace("¾","0,75").replace(/\s/g,"");
    reste=m[2];
    const mots=reste.split(" ");
    for(let k=Math.min(4,mots.length-1);k>=1;k--){
      const u=trouverUnite(norm(mots.slice(0,k).join(" ")).replace(/\.$/,""));
      if(u){ unite=u; reste=mots.slice(k).join(" "); break; }
    }
  }
  reste=reste.replace(/^(de |d'|d’|des |du )/i,"").trim();
  const nom = nomConnu(reste) || cap(reste);
  if(!unite) unite = qte ? (uniteParDefaut(nom)==="g" && !nomConnu(reste) ? "pièce" : uniteParDefaut(nom)) : uniteParDefaut(nom);
  if(qte && unite==="au goût") unite="pincée";
  return {nom, qte, unite};
}

function tousIngredientsConnus(){
  const m=new Map(); TOUS_CATALOGUE.forEach(n=>m.set(sing(n),n));
  recettes.forEach(r=>(r.ingredients||[]).forEach(i=>{ if(i.nom && !m.has(sing(i.nom))) m.set(sing(i.nom),i.nom); }));

function ingredientsFrequents(){

  recettes.forEach(r=>(r.ingredients||[]).forEach(i=>{ if(["sel","poivre"].includes(norm(i.nom))) return; c.set(i.nom,(c.get(i.nom)||0)+1); }));
  return [...c.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function ingrMatch(nomRecette, cherche){
  const a=sing(nomRecette), b=sing(cherche);
  if(a===b || a.includes(b)) return true;
  if(b==="pate") return PATES.some(p=>a.startsWith(p)) && !a.startsWith("pate ");
  return false;
}
const contient=(r,x)=>(r.ingredients||[]).some(i=>ingrMatch(i.nom,x));
function aStyle(r,st){
  if((r.tags||[]).includes(st)) return true;

  if(st==="Rapide") return +r.duree>0 && +r.duree<=30;
  if(st==="Pâtes") return ing.some(n=>PATES.some(p=>n.startsWith(p)) && !n.startsWith("pate "));

}

async function reduireImage(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",0.85));
  }catch{ return file; }
}

function importSimple(){
  const txt=(B._imp||"").trim();
  if(txt.length<20){ W.impMsg="Collez d'abord le texte de la recette."; render(); return; }
  const lignes=txt.split(/\n+/).map(l=>l.replace(/^\s*[-•*·]\s*/,"").trim()).filter(Boolean);
  const ing=[], et=[]; let titre="";
  for(const l of lignes){
    if(/^(\d|½|¼|¾)/.test(l) && l.length<80){ const a=analyserLigne(l); if(a&&a.nom) ing.push(a); continue; }
    if(/^(sel|poivre)\b/i.test(l) && l.length<40){ ing.push({nom:cap(l.split(/[ ,]/)[0].toLowerCase()),qte:"",unite:"au goût"}); continue; }
    if(!titre && l.length<80 && !/ingr|étape|preparation|préparation|personnes/i.test(l)){ titre=l; continue; }
    if(l.length>=35) et.push(l.replace(/^(étape\s*)?\d+[.):-]?\s*/i,""));
  }
  if(titre && !B.titre) B.titre=titre;
  if(ing.length) B.ingredients=ing;
  if(et.length) B.etapes=et;
  garderBrouillon();
  W.etape=4; W.msg="Fiche pré-remplie : vérifiez chaque partie, puis enregistrez."; W.msgOk=true; render(); scrollTo({top:0});
}
async function demarrerSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ MOI=null; peutEcrire=false; S.vue="login"; charge=true; render(); return; }
  const u=session.user;
  const [adm, prof] = await Promise.all([sb.rpc("is_admin"), sb.from("profils").select("*").eq("id",u.id).maybeSingle()]);
  MOI={id:u.id, email:u.email, admin:!!adm.data, prenom:prof.data?.prenom||"", photo:prof.data?.photo||""};
  if(!prof.data) await sb.from("profils").insert({id:u.id, prenom:""});
  assets=true; peutEcrire=true;
  await chargerTout();

}

async function traiterPhoto(cible, file){
  const msg=document.getElementById(`photo-${cible}-msg`);
  if(!file || !/^image\//.test(file.type||"image/")){ if(msg) msg.textContent="Ce fichier n'est pas une image."; return; }
  if(msg) msg.textContent="Envoi de la photo…";
  try{
    const id=await envoyerPhoto(file);
    if(cible==="moi"){ const {error}=await sb.from("profils").update({photo:id}).eq("id",MOI.id); if(error) throw error; MOI.photo=id; await chargerTout(); render(); }
    else if(cible==="wz"){ B.photo=id; garderBrouillon(); render(); }
    else { const r=recettes.find(x=>x.id===S.ficheId); if(!r) return; const {error}=await sb.from("recettes").update({photo:id}).eq("id",r.id); if(error) throw error; await chargerTout(); render(); }
  }catch(err){ if(msg) msg.textContent="La photo n'a pas pu être envoyée. Essayez une image plus légère (moins de 20 Mo)."; }
}
async function retirerPhoto(cible){
  try{
    if(cible==="moi"){ await sb.from("profils").update({photo:""}).eq("id",MOI.id); MOI.photo=""; await chargerTout(); render(); return; }
    if(cible==="wz"){ B.photo=""; garderBrouillon(); render(); return; }
    const r=recettes.find(x=>x.id===S.ficheId); if(!r) return;
    await sb.from("recettes").update({photo:""}).eq("id",r.id); await chargerTout(); render();
  }catch{}
}
async function envoyerPhoto(file){
  const blob=await reduireImage(file);
  const path=`${MOI.id}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}.jpg`;
  const {error}=await sb.storage.from("photos").upload(path, blob, {contentType:blob.type||"image/jpeg", upsert:false});
  if(error) throw error;
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}
function resultats(){
  const mots=norm(S.q).split(/\s+/).filter(Boolean);
  let out=recettes.map(r=>({r,hits:S.ingr.filter(x=>contient(r,x))}));
  if(mots.length) out=out.filter(({r})=>{
    const hay=norm([r.titre,r.categorie,(r.tags||[]).join(" "),(r.ingredients||[]).map(i=>i.nom).join(" "),r.auteur].join(" "));
    return mots.every(w=>hay.includes(w) || hay.includes(w.replace(/(s|x)$/,"")));
  });
  if(S.types.length) out=out.filter(({r})=>S.types.includes(r.categorie));
  if(S.styles.length) out=out.filter(({r})=>S.styles.every(st=>aStyle(r,st)));
  if(S.principal.length) out=out.filter(({r})=>S.principal.some(p=>aPrincipal(r,p)));
  if(S.auteur) out=out.filter(({r})=>filtreAuteur(r,S.auteur));
  if(S.dureeMax) out=out.filter(({r})=>+r.duree>0 && +r.duree<=S.dureeMax);
  if(S.ingr.length){
    out=out.filter(o=>S.complet? o.hits.length===S.ingr.length : o.hits.length>0);
    out.sort((a,b)=>b.hits.length-a.hits.length || (a.r.ingredients||[]).length-(b.r.ingredients||[]).length);
  } else out.sort((a,b)=>String(b.r.creeLe||"").localeCompare(String(a.r.creeLe||"")));
  return out;
}
function suggestions(q){
  const n=norm(q); if(!n) return null;
  const f=arr=>arr.filter(x=>norm(x).includes(n)).sort((a,b)=>(norm(a).startsWith(n)?0:1)-(norm(b).startsWith(n)?0:1)||a.length-b.length);
  return {
    types:f(TYPES).filter(x=>!S.types.includes(x)).slice(0,3),
    styles:f(STYLES).filter(x=>!S.styles.includes(x)).slice(0,4),
    ingr:f(tousIngredientsConnus()).filter(x=>!S.ingr.includes(x)).slice(0,8),
    rec:recettes.filter(r=>norm(r.titre).includes(n)).slice(0,4)
  };
}

function fmtQte(q,f){
  const s=String(q||"").replace(",",".");
  let n = s.includes("/") ? (()=>{const [a,b]=s.split("/");return +a/+b;})() : parseFloat(s);
  if(!isFinite(n)) return esc(q||"");
  return String(Math.round(n*f*100)/100).replace(".",",");
}

/* ---------- Rendu ---------- */
function render(garderFocus){
  const a=document.activeElement, fid=a&&a.id, sel=a&&a.selectionStart;
  app.innerHTML = S.vue==="attente"?`<div class="empty">${ic("skillet")}<span>Ouverture du carnet…</span></div>`:S.vue==="login"?vueLogin():S.vue==="fiche"||S.vue==="apercu"?vueFiche():S.vue==="form"?vueForm():S.vue==="profils"?vueProfils():S.vue==="miennes"?vueMiennes():S.vue==="valider"?vueValider():vueListe();
  document.getElementById("hdr-avs").innerHTML = MOI ? avatar(monAvatarNom(),"sm") : "";
  const enAttente = PROPS.filter(p=>p.statut==="en_attente").length;
  const extraL = MOI&&MOI.admin ? "À valider" : "Mes recettes";
  for(const id of ["tab-extra-l","nav-extra-l"]){ const el=document.getElementById(id); if(el) el.textContent=extraL; }
  const nb=document.getElementById("tab-extra-n"); nb.hidden=!(MOI&&MOI.admin&&enAttente); nb.textContent=enAttente;
  document.getElementById("nav-extra-l").textContent = MOI&&MOI.admin&&enAttente ? `À valider (${enAttente})` : extraL;
  document.getElementById("tab-add-l").textContent = MOI&&!MOI.admin ? "Proposer" : "Ajouter";
  document.getElementById("nav-ajout").lastChild.textContent = MOI&&!MOI.admin ? "Proposer" : "Ajouter";
  document.getElementById("nav-extra").hidden = !MOI || S.vue==="form";
  document.getElementById("nav-hasard").hidden = !MOI;
  document.getElementById("nav-profils").hidden = !MOI;
  const tb=document.getElementById("tabbar");
  tb.hidden = ["form","login","attente"].includes(S.vue);
  tb.querySelector('[data-tab="home"]').setAttribute("aria-current", S.vue==="liste"?"page":"false");
  tb.querySelector('[data-tab="add"]').hidden = !peutEcrire;
  document.getElementById("nav-ajout").hidden = S.vue==="form" || !peutEcrire;
  majStatus();
  if(garderFocus&&fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch{} } }
}
function aller(vue){ S.vue=vue; S.confirmSuppr=false; render(); window.scrollTo({top:0}); }
function focusId(id){ requestAnimationFrame(()=>{ const el=document.getElementById(id); if(el){ el.focus(); el.scrollIntoView({block:"nearest"}); } }); }
function ouvrirAjout(){ B=nouveauBrouillon(); W.etape=0; W.msg=""; W.impMsg=""; W.ingQ=""; aller("form"); }
function allerEtape(k){
  W.msg=""; W.msgOk=false;
  if(k>1 && W.etape===1 && !B.titre.trim()){ W.msg="Donnez d'abord un titre à la recette."; render(); focusId("t"); return; }
  W.etape=k; render(); window.scrollTo({top:0});
  if(k===1 && !B.titre) focusId("t");
  if(k===2) focusId("ing-add");
}

document.getElementById("home").onclick=()=>aller("liste");
document.getElementById("nav-ajout").onclick=ouvrirAjout;
document.getElementById("nav-hasard").onclick=auHasard;
document.getElementById("nav-profils").onclick=()=>aller("profils");

function auHasard(){
  const pool=resultats().map(o=>o.r), liste=pool.length?pool:recettes;
  if(!liste.length){ aller("liste"); return; }
  const autres=liste.length>1?liste.filter(r=>r.id!==S.ficheId):liste;
  const r=autres[Math.floor(Math.random()*autres.length)];
  S.ficheId=r.id; S.personnes=null; aller("fiche");
}
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  const t=b.dataset.tab;
  if(t==="home") aller("liste");
  else if(t==="add") ouvrirAjout();
  else if(t==="hasard") auHasard();
  else if(t==="extra"){ W.msg=""; aller(MOI&&MOI.admin?"valider":"miennes"); }
  else if(t==="frigo"){ S.vue="liste"; render(); document.getElementById("frigo")?.scrollIntoView({behavior:"smooth",block:"start"}); }
});

function ajouterIngr(nom, depuisSaisie){
  const p = depuisSaisie ? analyserLigne(W.ingQ) : null;
  const k=B.ingredients.findIndex(i=>sing(i.nom)===sing(nom));
  const ligne={nom, qte:p?.qte||"", unite:p?.qte?p.unite:uniteParDefaut(nom)};
  if(p && !p.qte) ligne.unite=uniteParDefaut(nom);
  if(k>=0){ if(ligne.qte) B.ingredients[k]={...B.ingredients[k],qte:ligne.qte,unite:ligne.unite}; }
  else B.ingredients.push(ligne);
  W.ingQ=""; garderBrouillon(); render();
  const idx = k>=0?k:B.ingredients.length-1;
  focusId(ligne.qte||ligne.unite==="au goût" ? "ing-add" : "qte-"+idx);
}

app.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  /* accueil */
  if(d.open){ S.ficheId=d.open; S.personnes=null; aller("fiche"); return; }
  if("back" in d){ aller("liste"); return; }
  if("goAjout" in d){ ouvrirAjout(); return; }
  if(d.add){ if(d.add==="ingr" && !S.ingr.includes(d.v) && S.ingr.length>=MAX_FRIGO){ return; } if(!S[d.add].includes(d.v)) S[d.add].push(d.v); S.q=""; S.sugMasque=false; render(); return; }
  if(d.rm){ S[d.rm]=S[d.rm].filter(x=>x!==d.v); render(); return; }
  if(d.toggle){ const L=S[d.toggle]; S[d.toggle]=L.includes(d.v)?L.filter(x=>x!==d.v):[...L,d.v]; render(); return; }
  if(t.id==="reset"){ Object.assign(S,{q:"",ingr:[],styles:[],types:[],principal:[],dureeMax:0,auteur:"",complet:false}); render(); return; }
  /* fiche */
  if(d.pers){ const r=recettes.find(x=>x.id===S.ficheId); S.personnes=Math.max(1,(S.personnes??(+r.personnes||1))+(+d.pers)); render(); return; }
  if(d.edit){ const r=recettes.find(x=>x.id===d.edit); B={...nouveauBrouillon(),...JSON.parse(JSON.stringify(r))}; if(!B.etapes.length) B.etapes=[""]; W.etape=1; W.msg=""; W.ingQ=""; aller("form"); return; }
  if(t.id==="suppr"){ S.confirmSuppr=true; render(); return; }
  if(t.id==="suppr-non"){ S.confirmSuppr=false; render(); return; }
  if(t.id==="suppr-ok"){ try{ await supprimer(S.ficheId); aller("liste"); }catch{ S.confirmSuppr=false; render(); statusEl.textContent="La suppression n'a pas abouti. Réessayez dans un instant."; } return; }
  /* assistant */
  if(t.id==="annuler"){ if(!B.id) lsSet(LS_DRAFT,null); B=null; aller("liste"); return; }
  if(t.id==="reprendre"){ B={...nouveauBrouillon(),...lsGet(LS_DRAFT,{})}; if(!B.etapes?.length) B.etapes=[""]; allerEtape(1); return; }
  if(t.id==="mode-main"){ B._web=false; allerEtape(1); return; }
  if(t.id==="mode-web"){ B._web=true; render(); focusId("imp-url"); return; }
  if(t.id==="imp-go"){ await importer(); return; }
  if(d.step){ allerEtape(+d.step); return; }
  if(t.id==="suiv"){ allerEtape(W.etape+1); return; }
  if(t.id==="prec"){ allerEtape(W.etape-1); return; }
  if(d.type){ B.categorie=d.type; garderBrouillon(); render(); return; }
  if(d.style){ B.tags=B.tags.includes(d.style)?B.tags.filter(x=>x!==d.style):[...B.tags,d.style]; garderBrouillon(); render(); return; }
  if(d.qui!=null && t.classList.contains("pp")){ S.auteur=d.qui; render(); return; }
  if(t.id==="export"){
    const data=JSON.stringify({app:"recettes-fm",version:1,exporteLe:new Date().toISOString(),recettes:recettes.map(r=>({...r,photo:""})),profils:Object.fromEntries(Object.entries(PROFILS).map(([k,v])=>[k,{...v,photo:""}]))},null,2);
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="recettes-fanie-michael-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove();
    const m=document.getElementById("backup-msg"); if(m) m.textContent=`${recettes.length} recettes exportées (sans les photos).`; return; }
  if(t.id==="login-send"){ await envoyerCode(); return; }
  if(t.id==="login-verify"){ await verifierCode(); return; }
  if(t.id==="login-back"){ Object.assign(L,{envoye:false,code:"",msg:""}); render(); return; }
  if(t.id==="logout"){ await sb.auth.signOut(); MOI=null; PROPS=[]; recettes=[]; charge=false; S.vue="login"; render(); return; }
  if(t.id==="moi-save"){ const v=(MOI.prenom||"").trim(); const m=document.getElementById("moi-msg"); if(!v){ if(m) m.textContent="Indiquez votre prénom."; return; } const {error}=await sb.from("profils").update({prenom:v}).eq("id",MOI.id); if(m) m.textContent=error?"Le prénom n'a pas pu être enregistré.":"Prénom enregistré."; if(!error){ await chargerTout(); } return; }
  if(t.id==="imp-simple"){ importSimple(); return; }
  if(d.apercu){ S.propId=d.apercu; S.retourVue=S.vue; S.personnes=null; aller("apercu"); return; }
  if("retourProps" in d){ aller(S.retourVue||"liste"); return; }
  if(d.pedit){ const p=PROPS.find(x=>x.id===d.pedit); if(!p) return; B={...nouveauBrouillon(),...JSON.parse(JSON.stringify(p.donnees||{})),_propId:p.id}; if(!B.etapes||!B.etapes.length) B.etapes=[""]; W.etape=1; W.msg=""; W.ingQ=""; aller("form"); return; }
  if(d.valider){ t.disabled=true; const {error}=await sb.rpc("valider_proposition",{p_id:d.valider}); if(error){ t.disabled=false; alertMsg("La validation n'a pas abouti. Réessayez."); return; } await chargerTout(); W.msg="Recette validée : elle est maintenant visible."; W.msgOk=true; aller("valider"); return; }
  if(d.refuser){ S.refusId=d.refuser; render(); focusId("motif"); return; }
  if("refusNon" in d){ S.refusId=null; render(); return; }
  if(d.refusOk){ const motif=(document.getElementById("motif")?.value||"").trim(); const {error}=await sb.from("propositions").update({statut:"refusee",motif,traite_le:new Date().toISOString()}).eq("id",d.refusOk); if(error){ alertMsg("Le refus n'a pas abouti. Réessayez."); return; } S.refusId=null; await chargerTout(); W.msg="Proposition refusée."; W.msgOk=true; aller("valider"); return; }
  if(d.moi){ const cur=lsGet(LS_MOI,""); lsSet(LS_MOI, cur===d.moi?null:d.moi); render(); return; }
  if(d.photoRm){ await retirerPhoto(d.photoRm); return; }
  if(d.princ){ const L=B.principal||[]; B.principal=L.includes(d.princ)?L.filter(x=>x!==d.princ):[...L,d.princ]; garderBrouillon(); render(); return; }
  if(d.aut){ B.auteur=d.aut; garderBrouillon(); render(); return; }
  if(d.bp){ B.personnes=Math.max(1,(+B.personnes||1)+(+d.bp)); garderBrouillon(); render(); return; }
  if(d.temps){ B.duree=+d.temps; garderBrouillon(); render(); return; }
  if(d.ingadd){ ajouterIngr(d.ingadd, true); return; }
  if(d.pick){ const k=B.ingredients.findIndex(i=>sing(i.nom)===sing(d.pick)); if(k>=0){ B.ingredients.splice(k,1); garderBrouillon(); const y=scrollY; render(); scrollTo({top:y}); } else { const y=scrollY; B.ingredients.push({nom:d.pick,qte:"",unite:uniteParDefaut(d.pick)}); garderBrouillon(); render(); scrollTo({top:y}); } return; }
  if(d.irm){ B.ingredients.splice(+d.irm,1); garderBrouillon(); render(); return; }
  if(t.id==="step-add"){ B.etapes.push(""); render(); focusId("step-"+(B.etapes.length-1)); return; }
  if(d.srm){ B.etapes.splice(+d.srm,1); if(!B.etapes.length) B.etapes=[""]; garderBrouillon(); render(); return; }
  if(t.id==="save"){ await sauver(); return; }
});

app.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="login-email"){ L.email=t.value.trim(); return; }
  if(t.id==="login-code"){ L.code=t.value.replace(/\s/g,""); return; }
  if(t.id==="moi-prenom" && MOI){ MOI.prenom=t.value; return; }
  if(t.id==="q"){ S.q=t.value; S.sugMasque=false; render(true); return; }
  if(!B) return;
  if(t.id==="ing-add"){ W.ingQ=t.value; render(true); return; }
  if(t.dataset.b){ B[t.dataset.b]=t.value; if(t.id==="d") {} garderBrouillon(); return; }
  if(t.dataset.qte!=null){ B.ingredients[+t.dataset.qte].qte=t.value; garderBrouillon(); return; }
  if(t.dataset.stepTxt!=null){ B.etapes[+t.dataset.stepTxt]=t.value; garderBrouillon(); return; }
  if(t.id==="imp-url"){ B.source=t.value; return; }
  if(t.id==="imp-txt"){ B._imp=t.value; return; }
});
app.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="import-file" && t.files && t.files[0]){
    const m=document.getElementById("backup-msg");
    try{
      const j=JSON.parse(await t.files[0].text()); if(!Array.isArray(j.recettes)) throw 0;
      const ids=new Set(recettes.map(r=>r.id)); let n=0;
      j.recettes.forEach(r=>{ if(r&&r.id&&r.titre){ const i=recettes.findIndex(x=>x.id===r.id); const keep=i>=0?recettes[i].photo:""; const nr={...r,photo:keep||""}; if(i>=0) recettes[i]=nr; else recettes.push(nr); n++; } });
      lsSet(LS_KEY,recettes); render(); const m2=document.getElementById("backup-msg"); if(m2) m2.textContent=`${n} recettes importées.`;
    }catch{ if(m) m.textContent="Ce fichier n'est pas une sauvegarde du carnet."; }
    return;
  }
  const mp=/^photo-(.+)-(cam|gal)$/.exec(t.id||"");
  if(mp && t.files && t.files[0]){ await traiterPhoto(mp[1], t.files[0]); return; }
  if(t.id==="f-duree"){ S.dureeMax=+t.value; render(); return; }
  if(t.id==="f-aut"){ S.auteur=t.value; render(); return; }
  if(t.id==="f-complet"){ S.complet=t.checked; render(); return; }
  if(B && t.dataset.unite!=null){ B.ingredients[+t.dataset.unite].unite=t.value; garderBrouillon(); return; }
  if(B && t.id==="d"){ render(); }
});
app.addEventListener("dragover", e=>{ const z=e.target.closest("[data-drop]"); if(z){ e.preventDefault(); z.classList.add("over"); } });
app.addEventListener("dragleave", e=>{ const z=e.target.closest("[data-drop]"); if(z) z.classList.remove("over"); });
app.addEventListener("drop", e=>{ const z=e.target.closest("[data-drop]"); if(!z) return; e.preventDefault(); z.classList.remove("over"); const f=e.dataTransfer?.files?.[0]; if(f) traiterPhoto(z.dataset.drop, f); });
app.addEventListener("keydown", e=>{
  const t=e.target;
  if(t.id==="login-email" && e.key==="Enter"){ e.preventDefault(); envoyerCode(); return; }
  if(t.id==="login-code" && e.key==="Enter"){ e.preventDefault(); verifierCode(); return; }
  if(t.id==="q" && e.key==="Enter"){
    e.preventDefault();
    const v=S.q.trim(), n=norm(v); if(!n) return;
    const typ=TYPES.find(x=>norm(x)===n), sty=STYLES.find(x=>norm(x)===n), ing=nomConnu(v);
    if(typ && !S.types.includes(typ)){ S.types.push(typ); S.q=""; }
    else if(sty && !S.styles.includes(sty)){ S.styles.push(sty); S.q=""; }
    else if(ing && !S.ingr.includes(ing) && S.ingr.length<MAX_FRIGO){ S.ingr.push(ing); S.q=""; }
    else S.sugMasque=true;
    render(true); return;
  }
  if(t.id==="t" && e.key==="Enter"){ e.preventDefault(); allerEtape(2); return; }
  if(t.id==="ing-add" && e.key==="Enter"){
    e.preventDefault(); const p=analyserLigne(W.ingQ); if(!p||!p.nom) return;
    const connu=nomConnu(p.nom);
    const premier=app.querySelector("[data-ingadd]")?.dataset.ingadd;
    const nom = connu || (premier && norm(premier).startsWith(norm(p.nom)) ? premier : p.nom);
    ajouterIngr(nom, true); return;
  }
  if(t.dataset.qte!=null && e.key==="Enter"){ e.preventDefault(); focusId("ing-add"); return; }
  if(t.dataset.stepTxt!=null){
    const k=+t.dataset.stepTxt;
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); B.etapes.splice(k+1,0,""); render(); focusId("step-"+(k+1)); return; }
    if(e.key==="Backspace" && !t.value && B.etapes.length>1){ e.preventDefault(); B.etapes.splice(k,1); render(); focusId("step-"+Math.max(0,k-1)); return; }
  }
});

function alertMsg(m){ statusEl.textContent=m; window.scrollTo({top:0}); }
async function envoyerCode(){
  const email=(L.email||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ L.msg="Entrez une adresse e-mail valide."; L.ok=false; render(); return; }
  L.msg="Envoi du code…"; L.ok=true; render();
  const {error}=await sb.auth.signInWithOtp({email, options:{shouldCreateUser:true}});
  if(error){ L.ok=false; L.msg = /rate|limit|seconds/i.test(error.message||"") ? "Trop de demandes de code. Attendez quelques minutes, puis réessayez." : "Le code n'a pas pu être envoyé. Vérifiez l'adresse, puis réessayez."; render(); return; }
  L.email=email; L.envoye=true; L.msg=""; render(); focusId("login-code");
}
async function verifierCode(){
  const token=(L.code||"").trim();
  if(token.length<6){ L.msg="Entrez le code reçu par e-mail."; L.ok=false; render(); return; }
  L.msg="Vérification…"; L.ok=true; render();
  const {error}=await sb.auth.verifyOtp({email:L.email, token, type:"email"});
  if(error){ L.ok=false; L.msg="Ce code ne fonctionne pas ou a expiré. Vérifiez-le, ou demandez-en un nouveau."; render(); return; }
  Object.assign(L,{code:"",envoye:false,msg:""});
  await demarrerSession();
}
async function sauver(){
  if(!B.titre.trim()){ W.msg="Ajoutez un titre (étape 1)."; render(); return; }
  if(MOI && !MOI.admin){
    const pre=(MOI.prenom||"").trim();
    if(!pre){ W.msg="Indiquez votre prénom, juste en dessous."; W.msgOk=false; render(); focusId("moi-prenom"); return; }
    await sb.from("profils").update({prenom:pre}).eq("id",MOI.id);
  }
  const rec={ id:B.id, titre:B.titre.trim(), categorie:B.categorie, personnes:+B.personnes||"", duree:+B.duree||"",
    auteur:B.auteur, tags:B.tags, principal:B.principal||[], photo:B.photo||"", ingredients:B.ingredients.map(i=>({nom:i.nom,qte:String(i.qte||"").trim(),unite:i.unite})),
    etapes:B.etapes.map(s=>String(s).replace(/^\s*\d+[.)]\s*/,"").trim()).filter(Boolean),
    notes:B.notes||"", source:(B.source||"").trim(), creeLe:B.creeLe };
  const btn=document.getElementById("save"); if(btn){ btn.disabled=true; btn.textContent="Enregistrement…"; }
  try{
    if(MOI && !MOI.admin){
      const propId=B._propId; await proposer(rec, propId);
      if(!B.id) lsSet(LS_DRAFT,null);
      B=null; W.msg= propId ? "Modification envoyée : elle sera visible après validation." : "Recette envoyée : elle sera visible après validation par Fanie ou Michael."; W.msgOk=true; aller("miennes"); return;
    }
    const id=await enregistrer(rec);
    if(!B.id) lsSet(LS_DRAFT,null);
    B=null; S.ficheId=id; S.personnes=null; aller("fiche");
  }catch(err){
    W.msg = "L'enregistrement n'a pas abouti. Vérifiez votre connexion, puis réessayez.";
    W.msgOk=false; render();
  }
}

async function importer(){
  const txt=(B._imp||"").trim();
  if(txt.length<30){ W.impMsg="Collez d'abord le texte de la recette (ingrédients et étapes)."; render(); return; }
  W.impEnCours=true; W.impMsg=""; render();
  const prompt=`Tu transformes une recette copiée depuis un site en fiche structurée, en français.
Réponds uniquement avec un objet JSON de cette forme :
{"titre":string,"categorie":string,"personnes":number|null,"duree":number|null,"ingredients":[{"nom":string,"qte":string,"unite":string}],"etapes":[string],"tags":[string]}
Règles :
- "categorie" : une valeur parmi ${JSON.stringify(TYPES)}.
- "duree" : temps total en minutes (préparation + cuisson + repos), null si inconnu.
- "unite" : une valeur parmi ${JSON.stringify(UNITES)}. Exemples : "2 cuillères à soupe" → qte "2", unite "c. à soupe" ; "3 œufs" → qte "3", unite "pièce" ; "sel, poivre" → qte "", unite "au goût".
- "nom" : si l'ingrédient correspond à un nom de cette liste, reprends exactement ce nom : ${JSON.stringify(TOUS_CATALOGUE)}. Sinon un nom court avec majuscule.
- "etapes" : une ou deux phrases par étape, sans numéro.
- "tags" : 0 à 3 valeurs parmi ${JSON.stringify(STYLES)}.

Texte de la recette :
"""
${txt.slice(0,12000)}
"""`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    if(!r||typeof r!=="object") throw {code:"invalid_json"};
    B.titre=String(r.titre||B.titre||"");
    if(TYPES.includes(r.categorie)) B.categorie=r.categorie;
    if(+r.personnes) B.personnes=+r.personnes;
    if(+r.duree) B.duree=+r.duree;
    if(Array.isArray(r.ingredients)) B.ingredients=r.ingredients.filter(i=>i&&i.nom).map(i=>({nom:String(i.nom),qte:String(i.qte??""),unite:UNITES.includes(i.unite)?i.unite:uniteParDefaut(i.nom)}));
    if(Array.isArray(r.etapes)&&r.etapes.length) B.etapes=r.etapes.map(String);
    if(Array.isArray(r.tags)) B.tags=r.tags.filter(x=>STYLES.includes(x)).slice(0,4);
    W.impEnCours=false; garderBrouillon();
    W.etape=4; W.msg="Fiche remplie par Claude. Vérifiez, puis enregistrez."; W.msgOk=true; render(); scrollTo({top:0});
  }catch(err){
    const c=err?.code; W.impEnCours=false;
    W.impMsg = c==="not_granted"||c==="sampling_disabled" ? "Claude n'est pas autorisé sur cette page : choisissez « Je l'écris »."
      : c==="rate_limited" ? "Trop de demandes pour le moment. Réessayez dans quelques minutes."
      : c==="cancelled" ? "" : "Claude n'a pas réussi à lire ce texte. Copiez seulement la partie recette, puis réessayez.";
    if(c==="not_granted"||c==="sampling_disabled") sample=null;
    render();
  }
}

/* ---------- Démarrage ---------- */
render();
(async()=>{
  if(!sb){ statusEl.textContent="Connexion impossible pour le moment. Rechargez la page."; return; }
  sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT"){ MOI=null; PROPS=[]; S.vue="login"; render(); } });
  try{ await demarrerSession(); }
  catch(e){ recettes=lsGet(LS_KEY,[]); charge=true; peutEcrire=false; S.vue=recettes.length?"liste":"login"; render(); statusEl.textContent="Hors connexion : lecture seule."; }
  document.addEventListener("visibilitychange", async()=>{
    if(document.visibilityState==="visible" && MOI && !["form","login"].includes(S.vue)){ try{ await chargerTout(); render(); }catch{} }
  });
})();
</script>
